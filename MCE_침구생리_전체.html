<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCE 침구생리 총정리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f8fafc;color:#1e293b;font-size:15px;padding-bottom:30px}
.header{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;padding:14px 16px;text-align:center}
.header h1{font-size:1.15rem;font-weight:700;margin-bottom:3px}
.header p{opacity:.85;font-size:.8rem}
.filters{background:#fff;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.filter-btn{padding:5px 11px;border-radius:20px;font-size:.78rem;font-weight:600;border:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.filter-btn:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.filter-btn.active{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sub-filters{background:#f8fafc;padding:8px 12px;display:none;gap:6px;border-bottom:1px solid #e2e8f0}
.sub-filters.show{display:flex}
.sub-btn{padding:4px 10px;border-radius:15px;font-size:.75rem;font-weight:600;border:1px solid #e2e8f0;background:#f8fafc;cursor:pointer}
.sub-btn.active{border-width:2px;background:#fff}
.search-wrap{padding:10px 12px;background:#fff;border-bottom:1px solid #e2e8f0}
.search-wrap input{width:100%;padding:8px 12px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:.88rem;outline:none;font-family:inherit}
.search-wrap input:focus{border-color:#2563eb}
.info-bar{padding:8px 14px;font-size:.78rem;color:#64748b;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.controls{display:flex;gap:4px}
.controls button{padding:3px 10px;font-size:.7rem;border:1px solid #cbd5e1;border-radius:5px;background:#fff;cursor:pointer}
.content{padding:0 12px}
.q-card{background:#fff;border-radius:10px;margin-top:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.q-card.hidden{display:none}
.q-inner{padding:12px 14px}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.q-num{font-size:.7rem;font-weight:700;color:#94a3b8;letter-spacing:.5px}
.q-cat{font-size:.68rem;padding:2px 8px;border-radius:10px;font-weight:600}
.q-text{font-size:.87rem;line-height:1.6;color:#334155;margin-bottom:10px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{padding:7px 11px;border-radius:7px;font-size:.84rem;line-height:1.4;background:#f8fafc;border:1px solid #e2e8f0;color:#475569}
.opt.correct{background:#dcfce7;border-color:#86efac;color:#15803d;font-weight:700}
.opt.correct::after{content:' ✅'}
.ans-btn{margin-top:8px;padding:5px 14px;border-radius:6px;font-size:.75rem;border:1px solid #e2e8f0;cursor:pointer;font-weight:600}
.pagination{display:flex;justify-content:center;gap:6px;margin-top:16px;flex-wrap:wrap}
.page-btn{padding:6px 14px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:.8rem;min-width:34px}
.page-btn.active{background:#2563eb;color:#fff;font-weight:700}
.page-btn:disabled{cursor:not-allowed;opacity:.5}
#no-result{text-align:center;padding:40px;color:#94a3b8;display:none}
</style>
</head>
<body>
<div class="header">
  <h1>🩺 MCE 침구생리 총정리</h1>
  <p>혈자리 · 두침 · 이침 · 자침기법 · CNT | 총 363문제</p>
</div>

<div class="filters" id="mainFilters"></div>
<div class="sub-filters" id="subFilters"></div>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="🔍 혈자리명, 증상, 키워드 검색..." />
</div>

<div class="info-bar">
  <span id="infoText"></span>
  <div class="controls">
    <button onclick="revealAll()">모두 보기</button>
    <button onclick="hideAll()">모두 숨김</button>
  </div>
</div>

<div class="content" id="content">
  <div id="no-result">😅 검색 결과 없음</div>
</div>

<div class="pagination" id="pagination"></div>

<script>
const DATA = [{"n":5,"q":"당신은 정천(定喘)혈에 자침했으나 혈자리를 빗나가 다시 자침하려 한다. 이때 가장 안전한 방법은 무엇인가?","opts":["a. 침을 재사용하거나 새 침을 사용하는 것이 모두 권장된다.","b. 같은 침을 재사용한다.","c. 같은 침을 사용하지만 신체의 다른 쪽에 사용한다.","d. 사용한 침은 샤프 폐기물 용기에 버리고 새 침을 사용한다."],"ans":"d","cat":"CNT","subcat":null},{"n":15,"q":"다음 혈자리 중 치질을 치료하고, 하음(下陰)에 이롭고, 경맥을 소통시키고, 통증을 완화하며, 정신을 안정시키는 혈자리는?","opts":["a. 수구(水溝)","b. 대추(大椎)","c. 장강(長强)","d. 요양관(腰陽關)"],"ans":"c","cat":"혈자리","subcat":"주치효능"},{"n":16,"q":"멸균(sterile)된 물품은 클린필드(clean field)의 어느 위치에 놓아야 하는가? 않는다.","opts":["a. 가장자리","b. 중앙","c. 클린필드(clean field) 위에 놓은 트레이(tray)에 놓지만 클린필드 자체에는 놓지","d. 클린필드(clean field) 근처에 놓지만 클린필드 위에는 놓지 않는다."],"ans":"b","cat":"CNT","subcat":null},{"n":19,"q":"다음 중 손등에서 첫 번째와 두 번째 중수골 사이, 두 번째 중수골의 중간점, 요골측에 가까운 곳에 위치에 위치한 혈자리는?","opts":["a. 비노(臂臑)","b. 곡지(曲池)","c. 삼간(三間)","d. 합곡(合谷)"],"ans":"d","cat":"혈자리","subcat":"혈위치"},{"n":25,"q":"피부를 뚫는 모든 물체는 다음 중 어떤 특성을 가져야 하는가?","opts":["a. 청결(clean)","b. 멸균(sterile)","c. 소독(disinfected)","d. 비누와 물로 세척"],"ans":"b","cat":"CNT","subcat":null},{"n":27,"q":"다음 중 어떤 혈자리는 뜸(灸)의 금기 사항이 아닌가?","opts":["a. 승읍(承泣), 사백(四白)","b. 편력(偏歷), 온류(溫溜)","c. 두유(頭維), 인영(人迎)","d. 화료(禾髎), 영향(迎香)"],"ans":"b","cat":"자침기법","subcat":null},{"n":29,"q":"다음 약재 중 폐(肺)와 간(肝) 경락으로 들어가는 약재는?","opts":["a. 상엽(桑葉)","b. 생강피(生薑皮)","c. 향유(香薷)","d. 창이자(蒼耳子)"],"ans":"a","cat":"이침","subcat":null},{"n":30,"q":"다음 혈자리 중 허리의 정중선, 제1 요추 극돌기 아래 오목한 곳에 위치한 혈자리는?","opts":["a. 현추(懸樞)","b. 근축(筋縮)","c. 명문(命門)","d. 장강(長强)"],"ans":"a","cat":"두침","subcat":null},{"n":34,"q":"발침(拔針) 후, 다음 중 적절한 조치는? 버린다","opts":["a. 치료 테이블 클린필드(clean field)에 놓는다","b. 트레이(tray)에 임시로 놓고 모두 제거되면 샤프폐기물통(sharps container)에","c. 조수한테 건너 샤프폐기물통에 버리게 한다","d. 즉시 샤프폐기물통에 버린다"],"ans":"d","cat":"CNT","subcat":null},{"n":35,"q":"다음 혈자리 중 새끼손가락(다섯째 손가락) 조갑각에서 0.1촌 떨어진 곳, 손톱 요측 경계선과 손톱 뿌리선이 만나는 지점에 위치한 혈자리는?","opts":["a. 소상(少商)","b. 전곡(前谷)","c. 소부(少府)","d. 소충(少衝)"],"ans":"d","cat":"혈자리","subcat":"혈위치"},{"n":37,"q":"다음 중 어떤 혈자리가 위기(衛氣)를 조절하고 땀을 조절하며, 풍을 몰아내고 표(表)를 풀어주며, 안면, 눈, 코, 입, 귀를 조절하고, 경락을 소통시켜 통증을 완화시키고, 분만을 촉진하며 양기를 회복시키는 효능을 가지고 있는가?","opts":["a. 합곡(合谷)","b. 영향(迎香)","c. 수삼리(手三里)","d. 이간(二間)"],"ans":"a","cat":"혈자리","subcat":"주치효능"},{"n":40,"q":"다음 중 통경지통(通經止痛), 청열소종(淸熱消腫), 청리습열(淸利濕熱) 및 황달(黃疸)를 치료하는 효능이 있는 혈자리는?","opts":["a. 완골(腕骨)","b. 청궁(聽宮)","c. 소택(少澤)","d. 곡원(曲垣)"],"ans":"a","cat":"혈자리","subcat":"주치효능"},{"n":42,"q":"다음 중 침을 놓기 전에 혈자리를 촉진하는 것에 대한 설명으로 옳은 것은?","opts":["a. 침을 놓기 전에 혈자리를 만지지 않아야 한다.","b. 혈자리는 라텍스 장갑을 낀 다른 손으로만 만져야 한다.","c. 혈자리는 멸균 면 거즈를 통해 만져야 한다.","d. 혈자리는 피부를 소독한 후 만질 수 있다."],"ans":"d","cat":"CNT","subcat":null},{"n":44,"q":"다음 중 사경(斜頸)과 목이 움직이지 않을 때 사용하는 혈자리는?","opts":["a. 견정(牵正)","b. 팔사(八邪)","c. 낙침(落枕)","d. 사봉(四縫)"],"ans":"c","cat":"혈자리","subcat":"주치효능"},{"n":45,"q":"외후두융기에서 1cm 외측이며 머리의 정중선과 평행하게 위쪽으로 뻗어 있는(길이 4cm) 두피침 영역은 다음 중 어떤 증상 치료에 가장 효과적인가?","opts":["a. 피질 시각 상실, Cortical blindness","b. 수용성 실어증, Receptive aphasia","c. 실행증, Apraxia","d. 상복부 불편감, Discomfort in the upper abdomen"],"ans":"a","cat":"두침","subcat":null},{"n":46,"q":"어지럼증, 이명(耳鳴), 몸이 마름, 노칙기단(勞則氣短), 요통(腰痛), 난청(難聽), 도한(盜汗) 등 증상을 다음 중 어떤 진단이 가장 정확하게 설명하는가?","opts":["a. 신기불고(腎氣不固)","b. 폐신음허(肺腎陰虛)","c. 신음허(腎陰虛)","d. 신양허(腎陽虛) 겸 수범폐(水泛肺)"],"ans":"b","cat":"이침","subcat":null},{"n":47,"q":"다음 중 팔회혈(八會穴)이 아닌 것은 무엇인가?","opts":["a. 전중(膻中)","b. 기해(氣海)","c. 태연(太淵)","d. 현종(懸鍾)"],"ans":"b","cat":"혈자리","subcat":"특수혈"},{"n":48,"q":"다음 중 어떤 혈자리가 넷째 발가락의 등쪽, 발톱 외측 경계선과 발톱 밑선이 만나는 지점, 조갑각(爪甲角)에서 약 0.1촌 떨어진 곳에 위치하는가?","opts":["a. 협계(俠谿)","b. 지오회(地五會)","c. 족규음(足竅陰)","d. 족임읍(足臨泣)"],"ans":"c","cat":"혈자리","subcat":"혈위치"},{"n":49,"q":"다음 중 어떤 혈자리가 아래 다리의 바깥쪽, 외측 복사뼈 융기 위로 7촌, 비골의 앞쪽 경계에 위치하는가?","opts":["a. 외구(外丘)","b. 족삼리(足三里)","c. 양교(陽交)","d. 상거허(上巨虛)"],"ans":"a","cat":"혈자리","subcat":"주치효능"},{"n":50,"q":"다음 중 흉쇄유돌근의 후연(後緣), 후두융기와 같은 높이에 위치한 혈자리는?","opts":["a. 천용(天容)","b. 견외수(肩外兪)","c. 천창(天窓)","d. 곡원(曲垣)"],"ans":"c","cat":"혈자리","subcat":"혈위치"},{"n":51,"q":"다음 중 어느 혈자리가 기충(氣衝)에서 3촌 아래, 대퇴 내전근의 전연(前沿)에 위치한 혈자리는 무엇인가?","opts":["a. 급맥(急脈)","b. 족오리(足五里)","c. 음포(陰包)","d. 음렴(陰廉)"],"ans":"b","cat":"혈자리","subcat":"혈위치"},{"n":52,"q":"다음 중 어떤 절차가 올바른가?","opts":["a. 침을 놓기 전에 환자의 피부를 닦고 알코올이 마를 때까지 기다린다.","b. 샤프폐기물통(sharps container)를 클린필드(clean field) 위에 놓는다.","c. 솜으로 피부를 닦는 즉시 침을 삽입한다.","d. 알코올통을 클린필드(clean field) 위에 놓는다."],"ans":"a","cat":"CNT","subcat":null},{"n":55,"q":"다음 중 장문 바로 아래, 열한 번째 갈비뼈 끝의 앞쪽과 아래쪽, 배꼽과 같은 높이에 위치하는 혈자리는?","opts":["a. 대맥(帶脈)","b. 목창(目窗)","c. 오추(五樞)","d. 두임읍(頭臨泣)"],"ans":"a","cat":"혈자리","subcat":"혈위치"},{"n":58,"q":"다음 중 부종, 구취, 갈증, 변비, 황태(黃苔), 실삭맥(實數脈)을 동반한 치통을 치료하기 위해 주요 혈자리에 추가할 조합은 무엇인가?","opts":["a. 내정(內庭), 노궁(勞宮)","b. 소상(少商), 소충(少衝)","c. 합곡(合谷), 대영(大迎)","d. 척택(尺澤), 충양(衝陽)"],"ans":"a","cat":"혈자리","subcat":"주치효능"},{"n":59,"q":"19세 여성 환자가 14세에 초경을 시작했으며 그 이후로 매달 규칙적으로 월경을 해왔다고 말한다. 그러나 월경 2~3일 전에 가슴, 옆구리, 유방에 붓는 느낌이 들고, 아랫배가 묵직하고 붓는 느낌이 듭다. 그녀는 월경통을 겪고 있으며 월경혈은 암적색이고 덩어리져 있다. 혀는 정상으로 보이고 설태는 얇으며 맥은 현맥(弦脈)입다. 이 환자의 감별 진단은?","opts":["a. 간신허(肝腎虛)","b. 간담습열(肝膽濕熱)","c. 한습사울(寒濕邪鬱)","d. 간기울결(肝氣鬱結)"],"ans":"d","cat":"혈자리","subcat":"주치효능"},{"n":63,"q":"다음 중 어떤 CNT 프로토콜이 권장(recommended)되지만 필수(essential)는 아닌가?","opts":["a. OPIM에 노출될 가능성이 있는 경우 장갑 착용","b. 치료 전 손 씻기","c. 각 환자마다 새 가이드 튜브 사용","d. 침술 전 알코올로 환자의 피부 닦기"],"ans":"d","cat":"CNT","subcat":null},{"n":65,"q":"다음 중 어떤 혈자리가 혈열(血熱), 특히 피부 질환에 대한 경험혈인가?","opts":["a. 곡지(曲池)","b. 간수(肝兪)","c. 혈해(血海)","d. 은백(隱白)"],"ans":"c","cat":"혈자리","subcat":"주치효능"},{"n":70,"q":"체침(滯針) 즉 침이 피부에 물렸을 때 적절한 방법이 아닌 것? 피부를 마사지하거나 근처에 다른 침을 자침하여 조직을 더욱 이완시킵다.","opts":["a. 근육의 긴장으로 인한 체침인 경우, 잠시 그대로 두었다가 혈자리 주변의","b. 자세 변경으로 인한 체침인 경우 원래 자세로 돌아갑다","c. 과도한 조작으로 인한 체침인 경우 핀셋으로 침을 잡고 빠르게 제거한다.","d. 과도한 염전으로 인한 체침인 경우 반대 방향으로 침을 돌립다."],"ans":"c","cat":"자침기법","subcat":null},{"n":77,"q":"다음 중 어느 혈자리가 삼초를 소통시키고 조절하며, 비와 위를 조절하고, 습을 제거하며, 수도(水道)를 조절하고, 배뇨을 촉진시키며, 덩어리를 풀어주는 역할을 합니까?","opts":["a. 대장수(大腸兪)","b. 위수(胃兪)","c. 삼초수(三焦兪)","d. 신수(腎兪)"],"ans":"c","cat":"혈자리","subcat":"주치효능"},{"n":79,"q":"다음 중 어떤 혈자리가 승광(承光) 뒤쪽으로 1.5촌, 앞머리선 위로 4촌, 정중선에서 바깥쪽으로 1.5촌 떨어진 곳에 위치하는가?","opts":["a. 승령(承靈)","b. 낙각(絡卻)","c. 통천(通天)","d. 목창(目窗)"],"ans":"c","cat":"두침","subcat":null},{"n":87,"q":"다음 중 충맥(衝脈)과 임맥(任脈)을 조절하며 하초(下焦)를 조절하는 혈자리는 무엇인가?","opts":["a. 사만(四滿)","b. 조해(照海)","c. 기혈(氣穴)","d. 복류(復溜)"],"ans":"c","cat":"혈자리","subcat":"주치효능"},{"n":88,"q":"손상된 피부가 혈액이나 체액에 노출된 경우, 손을 일회용 종이타월로 건조하기 전 어떤 물질로 세척하는 것을 권장되는가?","opts":["a. 먼저 손 소독제를 사용한 다음 비누와 물","b. 손 소독제와 물","c. 비누와 물","d. 냉수와 과산화수소"],"ans":"c","cat":"CNT","subcat":null},{"n":89,"q":"다음 중 간경(肝經)의 실열 또는 허열을 제거하는 혈자리는?","opts":["a. 여구(蠡溝)","b. 행간(行間)","c. 대돈(大敦)","d. 태충(太衝)"],"ans":"b","cat":"혈자리","subcat":"주치효능"},{"n":93,"q":"다음 혈자리 중 간(肝)을 소통시키고, 풍(風)을 진정시키며, 경련을 완화하고, 정신을 안정시키는 혈자리는?","opts":["a. 대추(大椎)","b. 지양(至陽)","c. 신주(身柱)","d. 근축(筋縮)"],"ans":"d","cat":"혈자리","subcat":"주치효능"},{"n":95,"q":"다음 중 태계(太谿)에서 1촌 아래, 발꿈치뼈 융기(아킬레스건이 발꿈치뼈에 삽입되는 부위)의 앞쪽 위 요함처에 위치한 혈자리는?","opts":["a. 복류(復溜)","b. 조해(照海)","c. 대종(大鐘)","d. 수천(水泉)"],"ans":"d","cat":"혈자리","subcat":"혈위치"},{"n":97,"q":"다음 중 어떤 경외기혈이 눈썹 외측 끝과 외안각 사이의 중간 지점에서 뒤쪽으로 약 1촌 떨어진 요함처(凹陷處)에 위치하는가?","opts":["a. 협승장(頰承漿)","b. 비통(鼻通)","c. 이첨(耳尖)","d. 태양(太陽)"],"ans":"d","cat":"이침","subcat":null},{"n":98,"q":"침을 놓을 혈자리를 촉진하기 전 해야 하는것는?","opts":["a. 손을 씻은 후, 침 놓을 자리를 닦기 전이나 후에","b. 손을 씻은 후, 침 놓을 자리를 닦은 후에","c. 손을 씻은 후, 침 놓을 자리를 닦기 전에","d. 손을 씻기 전, 침 놓을 자리를 닦은 후에"],"ans":"b","cat":"자침기법","subcat":null},{"n":101,"q":"다음 중 살아있는 조직의 미생물을 죽이도록 고안된 제품은?","opts":["a. 멸균제 (Sterilizer)","b. 소독제 (Antiseptic)","c. 표백제 (Bleaching agent)","d. 살균제 (Disinfectant)"],"ans":"b","cat":"CNT","subcat":null},{"n":102,"q":"다음 중 어떤 상황에서 장갑을 착용하지 않는가?","opts":["a. 환자의 복부를 촉진할 때","b. 출혈이나 OPIM이 있거나 있을 수 있는 경우","c. 시술자의 손에 열린 상처나 피부 병변이 있는 경우","d. 생식기나 입에 침을 놓거나 피부 병변 근처를 촉진할 때"],"ans":"a","cat":"CNT","subcat":null},{"n":106,"q":"샤프폐기물통(sharps container)는 치료실의 어디에 배치하고, 어느 정도 찼을 때 교체하는가?","opts":["a. 치료 테이블 옆; 50%","b. 치료 테이블 옆; 70%","c. 치료 테이블 위; 70%","d. 치료 테이블 근처 벽; 30%"],"ans":"b","cat":"CNT","subcat":null},{"n":109,"q":"다음 혈자리 중 승장(承漿) 옆 1촌에 위치한 혈자리는?","opts":["a. 협승장(夾承漿)","b. 영향(迎香)","c. 비통(鼻通)","d. 거료(巨髎)"],"ans":"a","cat":"혈자리","s 열(肝膽濕熱)","d. 간신허(肝腎虛)"],"ans":"b","cat":"혈자리","subcat":"주치효능"},{"n":1000,"q":"삼양경(三陽經)의 교회혈이며 수양명대장경과도 관련있는 경혈은?","opts":["a. 대추","b. 풍지","c. 두임읍","d. 화개"],"ans":"a","cat":"혈자리","subcat":"주치효능"},{"n":1004,"q":"환자가 다리 안쪽, 복부, 가슴, 심장, 위에 문제가 있을 때 다음 중 어떤 혈자리로 치료할 수 있는가?","opts":["a. 열결(列缺), 조해(照海)","b. 후계(後谿), 신맥(申脈)","c. 족임읍(足臨泣), 외관(外關)","d. 공손(公孫), 내관(內關)"],"ans":"d","cat":"혈자리","subcat":"주치효능"},{"n":1025,"q":"45세 남성 환자가 6개월 동안 불면증을 겪었으며, 기억력 저하, 심계(心悸), 현기증, 이명(耳鳴), 허리 통증, 가끔 유정(遺精), 그리고 손과 발바닥에 열감(오심번열, 五心煩熱) 증상이 있다. 혀는 설홍(舌紅)하고 소태(少苔)하다. 그의 맥상은 어떠할 것으로 예상하는가?","opts":["a. 세약맥(細弱脈)","b. 세삭맥(細數脈)","c. 현삭맥(弦數脈)","d. 활삭맥(滑數脈)"],"ans":"b","cat":"이침","subcat":null},{"n":1033,"q":"두침에서 명칭 언어 상실증(명사실어증)이 있는 환자 의 치료에 사용되는 언어구는 어떤 것인가 ?","opts":["a. 언어 1","b. 언어 2","c. 언어 3","d. 언어 4"],"ans":"b","cat":"두침","subcat":null},{"n":1034,"q":"소아감적 치료에 가장 좋은 혈은?","opts":["a. 제2, 3 장골간 중수지절관절의 후방 약 5분","b. 수배상 중지의 근위지관절의 중점","c. 제2, 3, 4, 5지 내면 근위지관절 횡문의 중점","d. 제2, 3, 4, 5지 배면 지봉 상단의 적백육제"],"ans":"c","cat":"혈자리","subcat":"주치효능"},{"n":1035,"q":"당신이 긴 바늘로 침치료를 할때 침체를 잡는데 사용되는 것은 ?","opts":["a. 목화 솜","b. 멸균 거즈 패드","c. 당신의 장갑 낀 손","d. 당신은 어떤 물질로 바늘의 샤프트를 터치 할 수 없다"],"ans":"b","cat":"CNT","subcat":null},{"n":1039,"q":"아래의 보기중 같은 높이에 위치한 혈들은? 1. 궐음수(厥陰俞), 고황수(膏肓俞) 2. 지양(至陽), 혼문(魂門) 3. 신궐(神闕), 대횡(大橫) 4. 대혁(大赫), 수도(水道)","opts":["a. I만 해당","b. I와 III만 해당","c. II와 IV만 해당","d. I와 IV만 해당"],"ans":"b","cat":"혈자리","subcat":"혈위치"},{"n":1040,"q":"천창혈에 속하지 않는혈은?","opts":["a. 천주","b. 부돌","c. 극천","d. 풍부"],"ans":"c","cat":"혈자리","subcat":"주치효능"},{"n":1052,"q":"모자배혈법에 의하여 취혈할 때, 간혈허(肝血虛)를 치료하는 오수혈은?","opts":["a. 행간과 곡천을 사한다","b. 행간과 곡천을 보한다","c. 행간과 소부를 사한다","d. 곡천과 음곡을 보한다"],"ans":"d","cat":"혈자리","subcat":"특수혈"},{"n":1053,"q":"기생충으로 인한 감염에 맞서 인체를 보호하기 위하여 증가하는 백혈구는?","opts":["a. 호산성구","b. 호염기구","c. 임파구","d. 호중성구"],"ans":"a","cat":"CNT","subcat":null},{"n":1058,"q":"폐경(肺經)과 비경(脾經)이 만나는 경혈은?","opts":["a. 중부","b. 운문","c. 태연","d. 열결"],"ans":"a","cat":"혈자리","subcat":"주치효능"},{"n":1063,"q":"다음 중 양교맥의 극혈은?","opts":["a. 교신","b. 공손","c. 수천","d. 부양"],"ans":"d","cat":"혈자리","subcat":"특수혈"},{"n":1074,"q":"40세 여자 환자가 급성 바이러스 감염에 걸렸다. 일주일 전 그녀는 고열, 매우 심한 항강(項强)과 두통(頭痛)이 있었다. 증상이 수막염과 유사하지만 배제되었고, 현재 증상은 고열, 극도로 약한 다리, 심한 기침, 코피, 구갈, 인건, 양이 적고 짙은 색 소변, 피부 건조가 있다. 설홍 무태이며, 맥세삭 일때, 진단은 무엇인가?","opts":["a. 폐열(肺熱)로 음액(陰液) 손상","b. 위화(胃火)","c. 습열(濕熱)","d. 풍열(風熱)이 폐(肺) 침범"],"ans":"a","cat":"CNT","subcat":null},{"n":1076,"q":"비기허로 인한 자궁출혈에 가장 좋은 치료혈은?","opts":["a. 두유","b. 삼음교","c. 은백(구)","d. 천추"],"ans":"c","cat":"혈자리","subcat":"주치효능"},{"n":1077,"q":"이침(耳針)에서 이수부(耳垂部)와 관련있는 부위는?","opts":["a. 상지(上肢)","b. 소화기관","c. 두면(頭面)","d. 구간(軀幹)과 하지(下肢)"],"ans":"c","cat":"이침","subcat":null},{"n":1079,"q":"변비를 치료하는 기본혈은 대장수, 천추, 지구, 조해이다. 만약 기체(氣滯)가 있다면, 다음 중 어느 혈을 첨가하는 것이 좋은가?","opts":["a. 곡지, 합곡","b. 신궐, 기해","c. 비유, 위유, 족삼리","d. 합곡, 태충"],"ans":"d","cat":"혈자리","subcat":"주치효능"},{"n":1091,"q":"갈증과 굶주림에 대한 이침 혈은 어디에 있는가?","opts":["a. 이륜","b. 대이륜","c. 이주","d. 대이주"],"ans":"c","cat":"이침","subcat":null},{"n":1092,"q":"외음부 소양증을 치료하는 가장 적절한 경혈은?","opts":["a. 여구","b. 혈해","c. 삼음교","d. 태충"],"ans":"a","cat":"혈자리","subcat":"주치효능"},{"n":1104,"q":"폐허로 인한 만성 기관지염에 가장 좋은 혈은?","opts":["a. 척택, 공최","b. 태연, 태백","c. 대저, 폐유","d. 곡지, 대추"],"ans":"b","cat":"혈자리","subcat":"주치효능"},{"n":1105,"q":"소독은 다음 중 어떤 과정을 말하는가?","opts":["a. 미생물의 접촉성을 감소시킴","b. 모든 미생물을 박멸시킴","c. 모든 미생물의 성장과 재생을 중지시킴","d. 모든 종류의 미생물 수를 감소시킴"],"ans":"b","cat":"CNT","subcat":null},{"n":1109,"q":"다음 중 어느 혈에 뜸을 적용 할 수 없는가 ?","opts":["a. 동자료","b. 상관","c. 솔곡","d. 풍지"],"ans":"a","cat":"혈자리","subcat":"주치효능"},{"n":1117,"q":"다음 중 인간 면역결핍 바이러스(HIV) 감염의 창문기(window phase)는 어떤 시기를 의미하는가?","opts":["a. 감염후 죽음까지의 기간","b. 감염후 첫 증상이 발현될때까지의 시간","c. 감염후 혈액 내에서 측정 가능한 만큼 항체 수가 형성되는 기간","d. 악화기와 호전기 사이의 기간"],"ans":"c","cat":"CNT","subcat":null},{"n":1119,"q":"환경조사를 하는 청년이 최근 남미와 아프리카의 개발 도상국들을 방문했는데, 그곳에서 지역에서 수자원에 노출되었다. 그가 돌아온 지 40일 후에 갑자기 열이 나며 복부의 불편감과 창만감, 그리고 우측 협륵부 근처의 통증을 호소하였으나, 방사통은 없었다. 식욕 저하, 오심구토, 기름진 음식을 피하며, 권태, 피로하고, 소량의 황색 소변을 본다. 제한된 정보를 바탕으로 가장 가능한 진단은?","opts":[     if (state.subCat && q.subcat !== state.subCat) return false;
    if (!state.search) return true;
    const s = state.search.toLowerCase();
    return q.q.toLowerCase().includes(s) || q.opts.some(o => o.toLowerCase().includes(s));
  });
}

function renderMainFilters() {
  const html = CATS.map(c => {
    const active = state.mainCat === c.key;
    const style = `background:${active ? c.bg : '#f8fafc'};color:${c.color};${active ? `border-color:${c.color}` : ''}`;
    return `<button class="filter-btn ${active ? 'active' : ''}" style="${style}" onclick="setMainCat('${c.key}')">
      ${c.icon} ${c.label} <span style="opacity:.7">(${catCounts[c.key] || 0})</span>
    </button>`;
  }).join('');
  document.getElementById('mainFilters').innerHTML = html;
}

function renderSubFilters() {
  const cat = CATS.find(c => c.key === state.mainCat);
  const subDiv = document.getElementById('subFilters');
  if (cat?.subs) {
    subDiv.className = 'sub-filters show';
    subDiv.innerHTML = cat.subs.map(s => {
      const active = state.subCat === s.key;
      const style = `color:${s.color};${active ? `border-color:${s.color}` : ''}`;
      return `<button class="sub-btn ${active ? 'active' : ''}" style="${style}" onclick="setSubCat('${s.key}')">
        ${s.label} (${catCounts[cat.key + '/' + s.key] || 0})
      </button>`;
    }).join('');
  } else {
    subDiv.className = 'sub-filters';
  }
}

function renderQuestions() {
  const filtered = filterData();
  const totalPages = Math.ceil(filtered.length / state.perPage);
  const paged = filtered.slice((state.page - 1) * state.perPage, state.page * state.perPage);
  
  document.getElementById('infoText').textContent = `${filtered.length}문제 | 페이지 ${state.page}/${totalPages || 1}`;
  document.getElementById('no-result').style.display = paged.length === 0 ? 'block' : 'none';
  
  const cat = CATS.find(c => c.key === state.mainCat);
  
  const html = paged.map(q => {
    const qCat = CATS.find(c => c.key === q.cat);
    const show = state.revealed[q.n];
    const displayCat = q.subcat ? `${qCat.icon} ${qCat.label}/${q.subcat}` : `${qCat.icon} ${qCat.label}`;
    const catColor = q.subcat && qCat.subs ? qCat.subs.find(s => s.key === q.subcat)?.color || qCat.color : qCat.color;
    const borderStyle = `border-left:4px solid ${catColor}`;
    
    const optsHtml = q.opts.map(opt => {
      const isAns = opt[0] === q.ans;
      const cls = show && isAns ? 'opt correct' : 'opt';
      return `<div class="${cls}">${opt}</div>`;
    }).join('');
    
    const btnStyle = `background:${show ? qCat.bg : '#f8fafc'};color:${show ? catColor : '#64748b'}`;
    
    return `<div class="q-card">
      <div class="q-inner" style="${borderStyle}">
        <div class="q-header">
          <span class="q-num">Q${q.n}</span>
          <span class="q-cat" style="background:${qCat.bg};color:${catColor}">${displayCat}</span>
        </div>
        <div class="q-text">${q.q}</div>
        <div class="opts">${optsHtml}</div>
        <button class="ans-btn" style="${btnStyle}" onclick="toggleAns(${q.n})">
          ${show ? '정답 숨기기' : '정답 보기'}
        </button>
      </div>
    </div>`;
  }).join('');
  
  document.getElementById('content').innerHTML = html + '<div id="no-result" style="display:none">😅 검색 결과 없음</div>';
  if (paged.length === 0 && state.search) {
    document.getElementById('no-result').style.display = 'block';
  }
  
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  if (totalPages <= 1) {
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  
  let html = `<button class="page-btn" onclick="prevPage()" ${state.page === 1 ? 'disabled' : ''}>◀ 이전</button>`;
  
  for (let i = 0; i < Math.min(totalPages, 10); i++) {
    const p = state.page <= 5 ? i + 1 : state.page - 4 + i;
    if (p < 1 || p > totalPages) continue;
    const active = p === state.page ? 'active' : '';
    html += `<button class="page-btn ${active}" onclick="setPage(${p})">${p}</button>`;
  }
  
  html += `<button class="page-btn" onclick="nextPage()" ${state.page === totalPages ? 'disabled' : ''}>다음 ▶</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function setMainCat(key) {
  state.mainCat = key;
  state.subCat = null;
  state.page = 1;
  state.revealed = {};
  renderMainFilters();
  renderSubFilters();
  renderQuestions();
}

function setSubCat(key) {
  state.subCat = state.subCat === key ? null : key;
  state.page = 1;
  renderSubFilters();
  renderQuestions();
}

function setPage(p) {
  state.page = p;
  renderQuestions();
  window.scrollTo(0, 0);
}

function prevPage() {
  if (state.page > 1) setPage(state.page - 1);
}

function nextPage() {
  const filtered = filterData();
  const totalPages = Math.ceil(filtered.length / state.perPage);
  if (state.page < totalPages) setPage(state.page + 1);
}

function toggleAns(n) {
  state.revealed[n] = !state.revealed[n];
  renderQuestions();
}

function revealAll() {
  const filtered = filterData();
  const paged = filtered.slice((state.page - 1) * state.perPage, state.page * state.perPage);
  paged.forEach(q => { state.revealed[q.n] = true; });
  renderQuestions();
}

function hideAll() {
  const filtered = filterData();
  const paged = filtered.slice((state.page - 1) * state.perPage, state.page * state.perPage);
  paged.forEach(q => { delete state.revealed[q.n]; });
  renderQuestions();
}

document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  state.page = 1;
  renderQuestions();
});

// Init
renderMainFilters();
renderSubFilters();
renderQuestions();
</script>
</body>
</html>
